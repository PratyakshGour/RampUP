services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: rampup-falkordb
    ports:
      - "6379:6379"   # database
      - "3000:3000"   # browser UI
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rampup-qdrant
    ports:
      - "6333:6333"   # REST + dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  falkordb_data:
  qdrant_data: